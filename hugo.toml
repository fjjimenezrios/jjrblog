baseurl = "/"
relativeURLs = true
canonifyURLs = false
locale = "es"
defaultContentLanguage = "es"
theme = "papermod"
enableGitInfo = true
enableRobotsTXT = true
paginate = 5

[params]
  images = ["https://fjjimenezrios.github.io/jjrblog/images/og.jpg"]
  contentTypeName = "post"
  showMenuItems = 2
  showLanguageSelector = false
  fullWidthTheme = true
  centerTheme = true
  autoCover = true
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowLastUpdated = true
  description = "Blog de un pensador que desarrolla: filosofía, política y desarrollo web."

[params.label]
  icon = "logo.png"
  iconHeight = 34

[params.twitter]
  creator = ""
  site = ""

[languages]
  [languages.es]
    label = "Español"
    title = "JJR Blog"
    [languages.es.params]
      subtitle = "Blog de un pensador que desarrolla"
      owner = ""
      keywords = ["blog", "development", "technology"]
      copyright = ""
      menuMore = "Mostrar más"
      readMore = "Leer más"
      readOtherPosts = "Leer otras entradas"
      newerPosts = "Entradas más recientes"
      olderPosts = "Entradas anteriores"
      missingContentMessage = "Página no encontrada..."
      missingBackButtonLabel = "Volver al inicio"
      minuteReadingTime = "min de lectura"
      words = "palabras"

      [languages.es.params.logo]
        logoText = "JJR Blog"
        logoHomeLink = "/"


[outputs]
  home = ["HTML", "RSS", "JSON"]

[menus]
  [[menus.main]]
    identifier = "search"
    name = "Buscar"
    url = "/search/"
    weight = 10
  [[menus.main]]
    identifier = "tags"
    name = "Etiquetas"
    url = "/tags/"
    weight = 20
  [[menus.main]]
    identifier = "archives"
    name = "Archivo"
    url = "/archives/"
    weight = 30
